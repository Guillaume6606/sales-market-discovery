# TCP relay publishing Postgres and Redis on the VPS Tailscale IP only (profile "tailnet").
# The 30m idle timeouts bound how long a vanished home worker can hold a Postgres
# advisory lock or session.
global
    log stdout format raw local0 warning

defaults
    mode tcp
    log global
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend postgres
    bind :5432
    default_backend postgres

backend postgres
    server db db:5432 resolvers docker init-addr last,libc,none

frontend redis
    bind :6379
    default_backend redis

backend redis
    server redis redis:6379 resolvers docker init-addr last,libc,none
