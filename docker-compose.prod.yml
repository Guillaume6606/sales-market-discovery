# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds Caddy reverse proxy (auto-HTTPS), restart policies,
# log rotation, resource limits, and db healthcheck.
# Does NOT load docker-compose.override.yml (no exposed ports, no gcloud mount).

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-admin}"
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, ui]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # REDIS_PASSWORD unset: same command as the image default (no auth).
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      APP_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # loopback only: deploy health check + SSH-tunnel access
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingestion:
    environment:
      APP_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    environment:
      APP_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"  # loopback only: SSH-tunnel access to dashboard
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Home ingestion worker access (docs/home-worker.md). Started only with
  # COMPOSE_PROFILES=tailnet; publishes db/redis on the Tailscale IP, never on 0.0.0.0.
  tailnet-gateway:
    image: haproxy:3.0-alpine
    profiles: ["tailnet"]
    command:
      - sh
      - -c
      - >-
        test -n "$$REDIS_PASSWORD" || { echo "REDIS_PASSWORD is required" >&2; exit 1; };
        exec haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports:
      - "${TAILNET_BIND_IP:-127.0.0.1}:5432:5432"
      - "${TAILNET_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - ./infra/tailnet/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [db, redis]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
